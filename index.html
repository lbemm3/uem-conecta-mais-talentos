function elig(s,v){

  if(v.nat==='Estágio')return s.tp==='Estudante'&&s.nv==='Graduação';

  return s.tp==='Egresso'||/^8º/.test(s.p)||s.nv!=='Graduação';
}
function matchV(s,v){
  if(!elig(s,v))return null;
  const sk=skills(s).map(norm),dn=s.dc.concat(s.dq).map(norm),tec=[],dis=[];
  v.tec.forEach(t=>{const n=norm(t);if(sk.includes(n))tec.push(t);else if(dn.some(d=>d.includes(n)))dis.push(t)});
  if(!tec.length&&!dis.length)return null;
  const cur=!!v.qc||v.cursos.includes(s.nv+': '+s.c.replace(/^(Mestrado|Doutorado) em /,''));
  let got=(tec.length+dis.length*.6)/v.tec.length*50+(cur?10:0),pos=60;
  const rs=recs(s),lab=q=>[...(q.ss||[]),...(q.sf||[])].map(norm),pool=rs.flatMap(lab),conf=v.comp.filter(x=>pool.includes(norm(x))),cn={};
  conf.forEach(x=>cn[x]=rs.filter(q=>lab(q).includes(norm(x))).length);
  const ev=conf.length>0;
  if(ev){pos+=40;got+=conf.length/v.comp.length*40}
  return{pts:Math.round(got/pos*100),tec,dis,cur,conf,cn,ev};
}

    else if(has(P.fr,p)){}else if(P.fr.length<P.free)P.fr.push(p);else toast('Limite de '+P.free+' competências livres')});
  pkRef(k);document.getElementById('pf'+k).focus()}
function vNew(){return`<div class="c" style="max-width:680px"><h2>Nova vaga</h2><div class="f">${inp('vt','Título da vaga')}${sel('vn','Natureza',['Selecione a natureza',...NAT],'kcTabs()')}<label>Competências técnicas<input id="vx" type="text" placeholder="Digite e pressione Enter (ex.: Python)" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}"></label><div id="tc" style="margin:-4px 0 12px">${chips()}</div><p class="m">Competências comportamentais desejadas (até 6 da lista e 2 livres)</p><div id="pkv" style="margin-bottom:10px">${pickerHtml('v')}</div><div id="kt">${kcTabsHtml()}</div><input id="kf" type="text" placeholder="Filtrar cursos de graduação" oninput="kcFil(this.value)"><div id="kc" style="margin:6px 0 10px">${kcBox()}</div>${inp('vv','Valor a ser pago (R$ por mês)','number')}${inp('vh','Carga horária semanal (horas)','number')}${inp('vb','Benefícios (opcional)')}</div><button class="b" onclick="saveVaga()">Publicar vaga</button> <button class="b o" onclick="vform=false;r()">Cancelar</button></div>`}
function saveVaga(){const g=i=>document.getElementById(i).value.trim();
  if(g('vx'))addTag();if(g('pfv'))pkAdd('v');
  const v={id:VG.length+1,cid:ce,titulo:g('vt'),nat:g('vn'),tec:[...vt],comp:[...PK.v.sel,...PK.v.fr],cursos:[...vks],qc:vqc,valor:+g('vv'),ch:+g('vh'),ben:g('vb'),est:'aberta',ab:agora(),rn:agora()};
  if(!NAT.includes(v.nat)){toast('Escolha a natureza da vaga');return}
  if(!v.titulo||!v.tec.length||!v.cursos.length){toast('Informe título, competências técnicas e ao menos um curso');return}
  if(v.nat==='Estágio'&&v.cursos.some(k=>!k.startsWith('Graduação: '))){toast('Estágio é só para graduação: remova os cursos de mestrado e doutorado');return}
  if(!(v.valor>0)||!(v.ch>0)){toast('Valor e carga horária semanal são obrigatórios');return}
  if(v.nat==='Estágio'&&v.ch>30){toast('Estágio no ensino superior tem limite de 30 horas semanais');return}
  VG.push(v);vform=false;toast('Vaga publicada');r()}
function vMatch(c,v){
  const res=S.filter(s=>s.pub).map(s=>({s,m:matchV(s,v)})).filter(x=>x.m).sort((a,b)=>b.m.pts-a.m.pts).slice(0,50);
  return`<div class="c"><button class="b o" onclick="vsel=null;r()">Voltar às vagas</button><h2 style="margin-top:12px">${esc(v.titulo)} <span class="st on">${esc(v.nat)}</span></h2><p class="m">${money(v)}</p><p class="m" style="margin-top:6px">Até 50 perfis publicados e elegíveis, por compatibilidade. Nada é enviado automaticamente: você escolhe a quem convidar.</p></div>
  ${res.map(({s,m})=>`<div class="c"><div class="row"><div><h2 style="margin:0">${esc(s.n)}</h2><span class="m">${esc(s.tp)} · ${esc(s.c)} · ${esc(s.p)} · ${esc(s.d)}</span></div><span class="sc">${m.pts}%</span></div><div class="bar"><i style="width:${m.pts}%"></i></div><div style="margin:8px 0">${why(m,v)}</div><button class="b o" onclick="goInv(${s.id},${v.id})">Ver perfil e convidar</button></div>`).join('')||'<div class="c m">Nenhum perfil elegível e compatível com esta vaga.</div>'}`}
function goInv(sid,vid){const s=S.find(x=>x.id===sid);bn=s.nv;bc=s.c;bs=sid;bq='';pv=VG.find(x=>x.id===vid).titulo;vsel=null;csub='b';r()}
function vVit(s){
  const cos=CO.filter(c=>c.st==='aprovada'),sets=['Todos',...new Set(cos.map(c=>c.setor))];
  const op=(a,cur)=>a.map(x=>`<option ${cur===x?'selected':''}>${x}</option>`).join('');
  const f=`<div class="c"><div class="row"><label class="m">Setor <select onchange="ef.set=this.value;r()">${op(sets,ef.set)}</select></label><label class="m">Tipo de vaga <select onchange="ef.nat=this.value;r()">${op(['Todas',...NAT],ef.nat)}</select></label><label class="m"><input type="checkbox" ${ef.onlyc?'checked':''} onchange="ef.onlyc=this.checked;r()"> Só vagas compatíveis com meu perfil</label></div>${s.pub?'':'<p class="m" style="margin-top:8px">Publique seu perfil para manifestar interesse nas vagas.</p>'}</div>`;
  const cards=cos.filter(c=>ef.set==='Todos'||c.setor===ef.set).map(c=>{
    const vs=VG.filter(v=>v.est==='aberta'&&v.cid===c.id&&(ef.nat==='Todas'||v.nat===ef.nat)).map(v=>({v,m:matchV(s,v)})).filter(x=>!ef.onlyc||x.m);
    if(!vs.length)return'';
    return`<div class="c"><h2>${esc(c.nf)}</h2><p class="m">${esc(c.setor)} · ${esc(c.cid)}/${esc(c.uf)} · Convênio de estágio com a UEM: ${esc(c.conv)}</p><p style="margin:6px 0">${esc(c.txt)}</p>${vs.map(({v,m})=>{const it=INV.find(i=>i.orig==='aluno'&&i.vid===v.id&&i.sid===s.id);
      const act=it?(it.st==='aceito'?`<span class="st on">Match aceito</span> <span class="m">Contato: ${esc(c.resp)}, ${esc(c.cargo)}, ${esc(c.mail)}</span>`:`<span class="st off">${it.st==='pendente'?'Interesse enviado, aguardando':'Recusado'}</span>`):`<button class="b o" ${s.pub?'':'disabled'} onclick="interest(${v.id})">Tenho interesse</button>`;
      return`<div class="it"><span><b>${esc(v.titulo)}</b> <span class="st on">${esc(v.nat)}</span> ${m?`<span class="tag">Compatibilidade ${m.pts}%</span>`:'<span class="m">Sem compatibilidade com seu perfil</span>'}<br><span class="m">${money(v)}</span><br>${act}</span></div>`}).join('')}</div>`}).join('');
  return f+(cards||'<div class="c m">Nenhuma vaga com esses filtros.</div>');
}
function interest(vid){const v=VG.find(x=>x.id===vid);INV.push({id:INV.length+1,cid:v.cid,sid:cs,msg:'Interesse na vaga',vaga:v.titulo,st:'pendente',orig:'aluno',vid});toast('Interesse enviado à empresa');r()}
function tally(list){const seen={},m={};list.forEach(x=>{const k=norm(String(x));const l=seen[k]||(seen[k]=x);m[l]=(m[l]||0)+1});return m}
function bars(m,max=6,sort=true){let t=Object.entries(m);if(sort)t.sort((a,b)=>b[1]-a[1]);t=t.slice(0,max);if(!t.length)return'<p class="m">Sem dados.</p>';const mx=Math.max(1,...t.map(x=>x[1]));return t.map(([k,n])=>`<div style="margin-bottom:8px"><div class="row"><span>${esc(k)}</span><span class="m">${n}</span></div><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`).join('')}
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
const card=(t,b)=>`<div class="c"><h2>${t}</h2>${b}</div>`;
const sec=t=>`<h2 style="font-size:18px;margin:20px 0 10px">${t}</h2>`;
function vP(){
  const p=S.filter(s=>s.pub),co=CO.filter(c=>c.st==='aprovada'),ct=INV.filter(i=>i.orig!=='aluno'),it=INV.filter(i=>i.orig==='aluno');
  const ac=INV.filter(i=>i.st==='aceito').length,rc=INV.filter(i=>i.st==='recusado').length,pe=INV.filter(i=>i.st==='pendente').length;
  const kp=(n,l)=>`<div class="c"><strong>${n}</strong>${l}</div>`;
  const supN={};Object.entries(tally(p.flatMap(skills))).forEach(([k,n])=>supN[norm(k)]=n);
  const gap=Object.entries(tally(VG.flatMap(v=>v.tec))).map(([k,n])=>({k,n,o:supN[norm(k)]||0})).sort((a,b)=>(a.o/a.n)-(b.o/b.n)||b.n-a.n).slice(0,6);
  const nat=NAT.map(n=>{const l=VG.filter(v=>v.nat===n);return l.length?`<tr><td>${n}</td><td>${l.length}</td><td>R$ ${Math.round(l.reduce((a,v)=>a+v.valor,0)/l.length).toLocaleString('pt-BR')}</td><td>${Math.round(l.reduce((a,v)=>a+v.ch,0)/l.length)}h</td></tr>`:''}).join('');
  return`<div class="st4">${kp(S.length,'perfis gerados do SIGAA')}${kp(p.length,'publicados ('+pc(p.length,S.length)+' de adesão)')}${kp(S.filter(s=>s.acct).length,'contas ativadas')}${kp(p.filter(s=>recs(s).length).length,'publicados com recomendação de orientador')}${kp(co.length,'empresas aprovadas ('+(CO.length-co.length)+' em análise)')}${kp(VG.filter(v=>v.est==='aberta').length,'vagas abertas ('+VG.filter(v=>v.est!=='aberta').length+' baixadas)')}${kp(INV.length,'contatos iniciados (convites e interesses)')}${kp(ac,'matches aceitos ('+pc(ac,ac+rc)+' das respostas)')}</div>
  ${sec('Estudantes e egressos (perfis publicados)')}
  <div class="g2">${card('Por nível',bars(tally(p.map(s=>s.nv)),3,false))}${card('Estudantes e egressos',bars(tally(p.map(s=>s.tp)),3))}${card('Disponibilidade',bars(tally(p.map(s=>s.d)),4))}${card('Cursos com mais perfis',bars(tally(p.map(s=>s.c)),6))}${card('Competências técnicas mais frequentes',bars(tally(p.flatMap(skills)),8))}${card('Competências comportamentais mais confirmadas por orientadores',bars(tally(p.flatMap(s=>recs(s).flatMap(q=>[...(q.ss||[]),...(q.sf||[])]))),8))}</div>
  ${sec('Empresas e vagas')}
  <div class="g2">${card('Empresas por setor',bars(tally(co.map(c=>c.setor)),6))}${card('Empresas por cidade',bars(tally(co.map(c=>c.cid+'/'+c.uf)),6))}${card('Vagas por natureza, valor e carga médios',nat?`<div class="tw"><table><tr><th>Natureza</th><th>Vagas</th><th>Valor médio</th><th>Carga média</th></tr>${nat}</table></div>`:'<p class="m">Sem dados.</p>')}${card('Cursos mais procurados pelas vagas',bars(tally(VG.filter(v=>!v.qc).flatMap(v=>v.cursos)),6)+`<p class="m" style="margin-top:6px">Vagas abertas a qualquer curso: ${VG.filter(v=>v.qc&&v.est==='aberta').length}</p>`)}${card('Competências técnicas mais pedidas',bars(tally(VG.flatMap(v=>v.tec)),8))}${card('Competências comportamentais mais pedidas',bars(tally(VG.flatMap(v=>v.comp)),8))}</div>
  ${sec('Demanda e oferta de competências')}
  <div class="g2">${card('Competências pedidas nas vagas e oferta nos perfis (menor oferta primeiro)',gap.map(g=>`<div class="row" style="margin-bottom:6px"><span>${esc(g.k)}</span><span class="m">${g.o?'em '+g.o+' perfil(is)':'<b>sem perfis</b>'} · pedida em ${g.n} vaga(s)</span></div>`).join('')||'<p class="m">Sem dados.</p>')}${card('Perfis compatíveis por vaga (vagas abertas)',VG.filter(v=>v.est==='aberta').map(v=>`<div class="row" style="margin-bottom:6px"><span>${esc(v.titulo)} <span class="m">${esc(CO.find(c=>c.id===v.cid).nf)}</span></span><span class="m">${p.filter(s=>matchV(s,v)).length} perfil(is)</span></div>`).join(''))}</div>
  ${sec('Resultados das vagas')}
  <div class="g2">${card('Situação das vagas',bars({'Abertas':VG.filter(v=>v.est==='aberta').length,'Preenchidas pela plataforma':VG.filter(v=>v.mot==='plat').length,'Preenchidas por outra fonte':VG.filter(v=>v.mot==='outra').length,'Encerradas sem contratação':VG.filter(v=>v.est==='baixada'&&!['plat','outra'].includes(v.mot)).length},4,false))}${card('Indicadores de resultado',(()=>{const bx=VG.filter(v=>v.est==='baixada'),pl=bx.filter(v=>v.mot==='plat'),ou=bx.filter(v=>v.mot==='outra'),cf=pl.filter(v=>v.conf==='confirmada').length,rw=(l,v)=>`<div class="row" style="margin-bottom:6px"><span>${l}</span><span class="m"><b>${v}</b></span></div>`;return rw('Vagas preenchidas (qualquer fonte), sobre as baixadas',pc(pl.length+ou.length,bx.length))+rw('Preenchidas pela plataforma, sobre as preenchidas',pc(pl.length,pl.length+ou.length))+rw('Contratações confirmadas pelo estudante',cf+' de '+pl.length)+rw('Confirmadas, sobre os matches aceitos',pc(cf,ac))+rw('Vagas vencidas aguardando resposta',VG.filter(v=>v.est==='aberta'&&dias(v.rn||v.ab)>=60).length)})())}${card('Motivos de baixa',bars(tally(VG.filter(v=>v.est==='baixada').map(v=>MOT[v.mot])),7))}${card('Tempo até preencher',(()=>{const av=l=>l.length?Math.round(l.reduce((a,v)=>a+(v.bx-v.ab)/DAY,0)/l.length)+' dias':'sem dados',rw=(l,v)=>`<div class="row" style="margin-bottom:6px"><span>${l}</span><span class="m"><b>${v}</b></span></div>`;return rw('Pela plataforma',av(VG.filter(v=>v.mot==='plat')))+rw('Por outra fonte',av(VG.filter(v=>v.mot==='outra')))})())}</div>
  ${sec('Contatos e matches')}
  <div class="g2">${card('Do contato ao match',bars({'Convites de empresas':ct.length,'Interesses de estudantes':it.length,'Aguardando resposta':pe,'Aceitos (matches)':ac,'Recusados':rc,'Encerrados (vaga baixada)':INV.filter(i=>i.st==='encerrada').length},6,false))}${card('Contatos por empresa',CO.filter(c=>c.st==='aprovada').map(c=>{const l=INV.filter(i=>i.cid===c.id);return`<div class="row" style="margin-bottom:6px"><span>${esc(c.nf)}</span><span class="m">${l.length} contato(s) · ${l.filter(i=>i.st==='aceito').length} aceito(s)</span></div>`}).join(''))}</div>`;
}
const oriMail=n=>n.replace(/^Profa?\.\s*(Dra?\.\s*)?/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,'.')+'@uem.br';
const ori=s=>{const i=s.it.find(x=>x.o);return i?i.o:''};
const recs=s=>(s.rq||[]).filter(q=>q.st==='recebida');
function oris(s){const m={};s.it.forEach(i=>{if(i.o)(m[i.o]=m[i.o]||{n:i.o,items:[]}).items.push(i)});return Object.values(m)}
const projs=o=>o.items.map(i=>i.t+': '+i.ti);
function recBox(s){
  const os=oris(s),rq=s.rq||[],tags=q=>[...(q.sk||[]),...(q.ss||[]),...(q.sf||[])].map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  let h=`<div class="c"><h2>Recomendações dos orientadores <span class="m">(opcional)</span></h2>`;
  h+=recs(s).map(q=>`<div class="it"><span>“${esc(q.txt)}”<br><span class="m">${esc(q.o)}${q.projs&&q.projs.length?' · '+q.projs.map(esc).join('; '):''} confirmou:</span> ${tags(q)}</span></div>`).join('');
  if(!os.length)return h+'<p class="m">Nenhum orientador encontrado no SIGAA para seus projetos.</p></div>';
  h+=`<p class="m" style="margin:8px 0">Estes orientadores vêm dos seus projetos no SIGAA. Cada pedido envia um e-mail ao endereço institucional do orientador. Pedidos: ${rq.length} de 5.</p>`;
  h+=os.map(o=>{const q=rq.find(x=>x.o===o.n);let act;
    if(!q)act=`<button class="b o" ${rq.length>=5?'disabled':''} data-o="${esc(o.n)}" onclick="askOri(this.dataset.o)">Pedir recomendação</button>`;
    else if(q.st==='recebida')act='<span class="st on">Recomendação recebida</span>';
    else act=`<span class="st off">Aguardando resposta</span> <details style="margin-top:6px"><summary class="m" style="cursor:pointer">Ver e-mail enviado</summary><div class="nv" style="margin-top:6px;background:var(--tag);color:var(--ink)"><b>Para:</b> ${esc(oriMail(o.n))}<br><b>Assunto:</b> Pedido de recomendação de ${esc(s.n)} no UEM CONECTA+<br><br>Olá, ${esc(o.n)}. ${esc(s.n)} (${esc(s.c)}) pede uma recomendação curta, de até 400 caracteres, sobre o que você viu em: ${projs(o).map(esc).join('; ')}. Pelo link abaixo você confirma competências e escreve o texto.<br><br><u>Abrir link da recomendação</u></div></details> <button class="b o" style="margin-top:6px" data-o="${esc(o.n)}" onclick="simOri(this.dataset.o)">${s.sim===o.n?'Fechar simulação':'Simular resposta do orientador'}</button>`;
    const form=s.sim===o.n&&q&&q.st==='aguardando'?`<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px"><p class="m">Simulação: é isto que ${esc(o.n)} vê ao abrir o link do e-mail. A pessoa é identificada pelo login institucional.</p><p style="margin:10px 0 4px"><b>Competências técnicas que você confirma</b></p>${[...new Set(o.items.flatMap(i=>i.k))].map(k=>`<label style="display:inline-block;margin-right:12px"><input class="ck" type="checkbox" value="${esc(k)}"> ${esc(k)}</label>`).join('')}<p style="margin:12px 0 4px"><b>Competências comportamentais que você confirma</b> <span class="m">(até 8 da lista e 2 livres)</span></p><div id="pko">${pickerHtml('o')}</div><p style="margin:12px 0 4px"><b>Recomendação</b> <span class="m">(até 400 caracteres)</span></p><textarea id="rt" maxlength="400" rows="5" oninput="document.getElementById('rc').textContent=this.value.length"></textarea><div class="m"><span id="rc">0</span>/400</div><button class="b" style="margin-top:8px" data-o="${esc(o.n)}" onclick="send(this.dataset.o)">Enviar recomendação</button></div>`:'';
    return`<div class="it" style="display:block"><b>${esc(o.n)}</b><br><span class="m">${projs(o).map(esc).join(' · ')}</span><div style="margin-top:6px">${act}</div>${form}</div>`}).join('');
  return h+'</div>';
}
function askOri(n){const s=S.find(x=>x.id===cs);if((s.rq||[]).length>=5){toast('Limite de 5 pedidos');return}(s.rq=s.rq||[]).push({o:n,st:'aguardando'});toast('E-mail enviado para '+oriMail(n));r()}
function simOri(n){const s=S.find(x=>x.id===cs);pkReset('o');s.sim=s.sim===n?'':n;r()}
function send(n){const s=S.find(x=>x.id===cs),t=document.getElementById('rt').value.trim();
  const pf=document.getElementById('pfo');if(pf&&pf.value.trim())pkAdd('o');
  if(t.length<20){toast('Escreva ao menos 20 caracteres');return}
  const q=(s.rq||[]).find(x=>x.o===n),o=oris(s).find(x=>x.n===n);
  Object.assign(q,{st:'recebida',projs:projs(o),txt:t,sk:[...document.querySelectorAll('.ck:checked')].map(x=>x.value),ss:[...PK.o.sel],sf:[...PK.o.fr]});s.sim='';toast('Recomendação recebida de '+n);r()}
function vD(){
  const rows=[['Nome, curso e período','Cadastro do discente e matrícula','Sim, com aval'],['Iniciação científica','Módulo de pesquisa (projetos e planos de trabalho)','Sim, com aval'],['TCC','Módulo de graduação (trabalhos de conclusão e orientação)','Sim, com aval'],['Estágio','Módulo de estágios','Sim, com aval'],['Extensão','Módulo de extensão (participação em ações)','Sim, com aval'],['Competências','Palavras-chave e área dos projetos e TCCs','Sim, com aval'],['Orientador','Vínculo de orientação nos projetos','Sim, com aval'],['Disponibilidade','Informada pelo estudante na plataforma','Sim, com aval'],['Disciplinas cursadas (aprovadas e em andamento)','Histórico escolar, apenas os nomes das disciplinas','Sim, com aval'],['Notas, faltas, reprovações e trancamentos','Módulo de graduação','Nunca'],['CPF, RG e documentos','Dados pessoais','Nunca'],['Foto, endereço, telefone e e-mail pessoal','Dados pessoais','Nunca']];
  return`<div class="c"><h2>De onde vem cada parte do perfil</h2><p class="m" style="margin-bottom:10px">Fontes sugeridas no SIGAA. Os módulos e campos exatos precisam ser confirmados com o NPD/UEM antes da implantação.</p><div class="tw"><table><tr><th>Parte do perfil</th><th>Fonte sugerida no SIGAA</th><th>Publicado?</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="st ${r[2]==='Nunca'?'off':'on'}">${r[2]}</span></td></tr>`).join('')}</table></div></div>
  <div class="nv">Princípios: o perfil só usa dados acadêmicos públicos, nada é publicado sem o aval do estudante e ele pode ocultar itens ou despublicar a qualquer momento.</div>`;
}
function r(){tick();document.getElementById('v').innerHTML=tab==='e'?vE():tab==='c'?vEmp():tab==='p'?vP():vD()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));r()});
r();
</script>
